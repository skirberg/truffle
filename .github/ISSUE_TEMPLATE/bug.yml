name: Something is broken
description: A page that fails, a map that won't load, a button that does nothing.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Which page?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 17, Safari
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and a screenshot if you can.
    validations:
      required: true
