name: Checks
# Every pull request and every push to main runs what `npm run check` runs, one step per check so a failure
# names itself: the type check, the 4 px grid and token rules, ESLint, Vitest, the production build, contrast,
# then qa (every route at every width, axe, sideways scroll, tap targets) and smoke against `next start`.
# Chromium draws the map in software (SwiftShader, set in playwright.config.ts), so a blank map can't pass.
# tests/ci.test.ts fails if a check is added to `npm run check` and not here.
on:
  pull_request:
  push:
    branches: [main]

# Reads the code and nothing else; no secrets are used, and the site runs on the data committed in data/.
permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Chromium for the page checks
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Grid and tokens
        run: npm run grid

      - name: Lint
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Contrast
        run: npm run contrast

      - name: Every route at every width (axe, sideways scroll, tap targets)
        run: npm run qa

      - name: Smoke (the map draws, the call, the sheet, the credit, reduced motion)
        run: npm run smoke

      - name: Keep what failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ github.run_number }}
          path: test-results/
          retention-days: 7
